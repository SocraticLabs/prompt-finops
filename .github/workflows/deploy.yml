name: Deploy Prompt Finops

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: rbiosas/prompt-finops:latest
          cache-from: type=registry,ref=rbiosas/prompt-finops:buildcache
          cache-to: type=registry,ref=rbiosas/prompt-finops:buildcache,mode=max

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull rbiosas/prompt-finops:latest
            docker stop prompt-finops-app || true
            docker rm prompt-finops-app || true
            docker run -d \
              --name prompt-finops-app \
              -p 127.0.0.1:3000:3000 \
              --restart unless-stopped \
              rbiosas/prompt-finops:latest
